[File Parameters]
# TIFF file input path and filename
input_path =
filename = Gorka
extension = tif
# Choose either a continuous range of frames (colon-separated) or manually pick specific frames (comma-separated) 
frames = 1:1
# Bit depth of input images (8, 12, or 16)
resolution = 8
# Parallelization option
parallel = 0

[Modules]
# Modules must be run sequentially
# 0 -> Background subtraction (acceptor)
# 1 -> Background subtraction (donor)
# 2 -> Ratio processing
# 3 -> background subtraction (both channels) + ratio processing
# 4 -> Bleach correction (Optional)
option = 3

[Background Parameters]
# Number of tiles that should fit along the long axis of the image (Suggested value for 1280X960 resolution is 40)
nwindow = 32
# Eps value for DBSCAN algorithm (Suggested value is 0.01)
# Eps values are set separately for acceptor [0] and donor [1] channels
# Higher values result in more foreground (0 means the channel is not processed)
eps = 0.5

# Radius (px) of a pre-clustering morphological opening that removes thin,
# static, high-contrast device artifacts (e.g. reflective/fluorescent
# microchannel walls) too narrow to survive it, while leaving wider real
# signal intact. 0 or empty disables it (default) — leave at 0 unless such
# artifacts are visible surviving background subtraction.
declutter_radius =

# Estimate declutter_radius automatically instead of setting it by hand —
# samples frames spread across the run and finds a natural width split
# between thin artifacts and real signal. Overrides declutter_radius above
# when enabled; falls back to it if no reliable split is found. See the log
# file for the estimated value and the numbers behind it. 0 or empty disables
# it (default).
declutter_auto =
# Which algorithm estimates the background. dbscan (default) is the per-tile
# clustering method above -- correct when real signal can be wider than one
# tile (roots, bulk cytoplasmic/membrane signal). tophat instead estimates the
# background as one large morphological opening (size tophat_size, px) -- a
# structuring element wider than real signal cannot fit inside it, so the
# background estimate is always built from genuinely surrounding pixels, never
# the signal itself. Only correct for signal narrower than tophat_size (e.g. a
# thin growing tube) -- NOT a general replacement for dbscan, leave at dbscan
# unless you have confirmed (by comparing outputs) that dbscan is corrupting a
# thin, persistent structure. Independent of declutter_radius/declutter_auto
# above -- decluttering removes things narrower than real signal, this removes
# everything wider than it -- use either alone or both together.
background_method =
tophat_size =

[Ratio Parameters]
# Crop pixels by left top corner and right bottom corner coordinates[x,y,x,y](0,0,0,0 indicates no crop) 
crop = 125,0,407,511
# (Boolean) Image registration for donor and accepter channels 
register = 0
# (Boolean) Consider only foreground pixel intensity overlapping between donor and accepter channels
union = 0

[Bleach Parameters]
# Bleach range for time-based intensity correction of donor and accepter channels 
acceptor_bleach_range = 1:1
donor_bleach_range = 1:1
# Bleach decay fit type (linear, exponential or loess) 
fit = linear
